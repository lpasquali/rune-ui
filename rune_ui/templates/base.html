<body>
    <header>
        <h1>RUNE <small style="font-size: 0.5em; color: var(--base01)">// INDUSTRIAL SRE AGENTIC PIPELINES</small></h1>
        <div class="theme-controls">
            <button id="theme-toggle" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
                <span id="theme-icon">◑</span>
            </button>
        </div>
    </header>
    <script>
    (function() {
        var btn = document.getElementById('theme-toggle');
        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            btn.textContent = theme === 'light' ? 'Light' : 'Dark';
        }
        var saved = localStorage.getItem('rune-theme');
        if (saved) {
            applyTheme(saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            applyTheme('light');
        } else {
            applyTheme('dark');
        }
        btn.addEventListener('click', function() {
            var next = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            localStorage.setItem('rune-theme', next);
            applyTheme(next);
        });
    <div class="container">
        <nav>
            <ul>
                <li><a hx-get="/dashboard" hx-target="#main">Dashboard</a></li>
                <li><a hx-get="/compare" hx-target="#main">Compare</a></li>

                <li><a hx-get="/reports" hx-target="#main">Reports</a></li>
            </ul>

            <div class="active-jobs-summary" style="margin-top: 40px; padding: 15px; background: rgba(38, 139, 210, 0.05); border-radius: var(--border-radius); border: 1px solid rgba(38, 139, 210, 0.1);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-weight: 700; font-size: 0.8rem; text-transform: uppercase;">Active Jobs</span>
                    <span id="global-job-badge" class="badge" hx-get="/api/jobs/count" hx-trigger="load, every 5s">0</span>
                </div>
                <button onclick="toggleDrawer()" style="width: 100%; font-size: 0.7rem; padding: 8px;">View Queue</button>
            </div>
        </nav>

                <h2>Welcome to RUNE</h2>
                <p>Select a module from the sidebar to begin.</p>
                <div id="status" hx-get="/api/status" hx-trigger="load, every 30s">
                    Checking RUNE API status...
                </div>
            </div>
        </main>

    <script>
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            const isLight = body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon(isLight);
        }

        function updateThemeIcon(isLight) {
            const icon = document.getElementById('theme-icon');
            icon.textContent = isLight ? '☀️' : '🌙';
        }

        // Initialize theme from localStorage
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                updateThemeIcon(true);
            } else {
                updateThemeIcon(false);
            }
        })();
    </script>
