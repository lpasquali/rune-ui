<div class="card" style="border-top: 5px solid var(--violet);">
    <h2>Benchmark Suite Wizard (Batch Mode)</h2>
    <p>Define a matrix of Agents and Models to instantiate parallel benchmarks.</p>
    
    <form hx-post="/suites/create" hx-target="#main" class="wizard-form">
        <fieldset style="border: 1px solid var(--base02); padding: 20px; margin-bottom: 20px; border-radius: 4px;">
            <legend style="color: var(--violet); font-weight: bold; padding: 0 10px;">1. Matrix Configuration</legend>
            
            <label for="agents">Target Agents (Comma separated):</label>
            <input type="text" id="agents" name="agents" value="sre:holmes,sre:k8sgpt,cyber:xbow" required style="margin-bottom: 15px;">

            <label for="models">Target Models (Comma separated):</label>
            <input type="text" id="models" name="models" value="llama3.1:8b,anthropic.claude-3-5-sonnet" required style="margin-bottom: 15px;">
        </fieldset>

        <fieldset style="border: 1px solid var(--base02); padding: 20px; margin-bottom: 20px; border-radius: 4px;">
            <legend style="color: var(--cyan); font-weight: bold; padding: 0 10px;">2. Shared Configuration</legend>
            
            <label for="backend_type">Backend Provider:</label>
            <select id="backend_type" name="backend_type" style="width: 100%; margin-bottom: 15px;">
                <option value="ollama">Ollama (Local/Vast)</option>
                <option value="bedrock">AWS Bedrock</option>
                <option value="openai">OpenAI</option>
            </select>

            <label><input type="checkbox" name="aws" value="true"> Enable AWS Cost Safety Gate</label><br>
        </fieldset>

        <button type="submit" style="width: 100%; padding: 15px; background: var(--violet); color: var(--base3); border: none; cursor: pointer; font-weight: bold;">INSTANTIATE PARALLEL BATCH</button>
    </form>
</div>

<div id="active-suites" style="margin-top: 40px;">
    <h3>Active Suites</h3>
    <div hx-get="/api/suites" hx-trigger="load, every 5s">
        <p style="color: var(--base01)">Loading active suites...</p>
    </div>
</div>
