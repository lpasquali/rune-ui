<div class="card" style="border-top: 5px solid var(--red);">
    <h2>Credential Vault</h2>
    <p>Manage secure API keys and authentication tokens for SaaS backends. Secrets are encrypted at rest.</p>
    
    <div id="secrets-container" style="margin-top: 30px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            {% for key, val in secrets.items() %}
            <div class="card" style="background: var(--base03); border: 1px solid var(--base01); padding: 15px;">
                <label style="font-weight: bold; color: var(--yellow)">{{ key }}</label>
                <div style="margin: 10px 0; font-family: monospace; color: var(--base01)">{{ val }}</div>
                
                <form hx-post="/secrets/update" hx-target="this" hx-swap="outerHTML">
                    <input type="hidden" name="key" value="{{ key }}">
                    <input type="password" name="value" placeholder="Enter new value..." style="margin-bottom: 10px;">
                    <button type="submit" style="width: 100%; padding: 5px; font-size: 0.7rem; border-color: var(--blue); color: var(--blue);">Update Key</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="card" style="margin-top: 30px; border-style: dashed; opacity: 0.8;">
        <h3>Add New Credential</h3>
        <form hx-post="/secrets/update" hx-target="#main">
            <div style="display: flex; gap: 10px;">
                <input type="text" name="key" placeholder="SECRET_NAME (e.g. VAST_API_KEY)" style="flex: 1;">
                <input type="password" name="value" placeholder="Value..." style="flex: 2;">
                <button type="submit" style="background: var(--green); color: var(--base03); padding: 0 20px;">Store</button>
            </div>
        </form>
    </div>
</div>
